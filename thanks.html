<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>お申し込みありがとうございます｜塙真弓 × 齋藤好美 コラボセミナー</title>
<style>
:root{--green-d:#2c5742;--gold:#c9a85c;--ink:#3a2f28}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:600;font-size:18px;line-height:1.9;color:var(--ink);background:linear-gradient(160deg,#e3efe5 0%,#fbf8f0 55%,#e8f1e6 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px}
.card{width:100%;max-width:560px;background:#fff;border-radius:22px;border:2px solid var(--gold);box-shadow:inset 0 0 0 6px #fbf6e6,0 4px 18px rgba(44,87,66,.12);padding:40px 26px 36px;text-align:center}
.mark{font-size:34px;color:var(--gold);line-height:1}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:29px;font-weight:800;color:var(--green-d);line-height:1.5;margin:14px 0 22px}
h1 span{display:inline-block}
p{font-size:19px;font-weight:700;margin-bottom:16px}
p span{display:inline-block}
.box{background:#eef5ec;border-radius:14px;padding:16px 14px;margin:22px 0 6px}
.box b{display:block;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--green-d);font-size:21px;font-weight:800}
.sub{font-size:15px;color:#5c4d42;font-weight:600;margin-top:22px}
</style>
</head>
<body>
<main class="card">
  <div class="mark">❖</div>
  <h1><span>お申し込み</span><span>ありがとうございます</span></h1>
  <p><span>確認のメールを</span><span>お送りしました。</span></p>
  <div class="box"><b>お支払いが済んで、</b><b>お申し込み完了です。</b></div>
  <p class="sub"><span>塙 真弓</span> <span>×</span> <span>齋藤 好美</span> <span>コラボセミナー</span></p>
</main>
</body>
</html>
